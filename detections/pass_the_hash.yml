title: Pass the Hash Activity
id: 8cb713fa-7e55-42a5-b86c-0f4341f646f2
status: experimental
description: >
  Detects successful NTLM logon activity consistent with pass-the-hash —
  a Logon Type 3 (network) logon using the NTLM ("NtLmSsp") logon process
  with zero key length, or a Logon Type 9 (NewCredentials) logon via the
  "seclogo" process — the pattern produced by wmiexec.py's -hashes flag
  and similar tools. Adapted from the SigmaHQ community rule for this
  lab's environment.
references:
    - https://blog.stealthbits.com/how-to-detect-pass-the-hash-attacks/
    - attacks/pass-the-hash.md
author: Vinay Koli
date: 18-09-2026 23:18:40
tags:
    - attack.defense_evasion
    - attack.lateral_movement
    - attack.t1550.002

logsource:
    product: windows
    service: security

detection:
    selection_logon3:
        EventID: 4624
        SubjectUserSid: 'S-1-0-0'
        LogonType: 3
        LogonProcessName: 'NtLmSsp'
        KeyLength: 0

    selection_logon9:
        EventID: 4624
        LogonType: 9
        LogonProcessName: 'seclogo'

    filter:
        TargetUserName: 'ANONYMOUS LOGON'

    condition: 1 of selection_* and not filter

falsepositives:
    - Administrator activity using explicit credentials
    - Legitimate penetration testing

level: medium
